<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Interactive Restaurent Menu </title>
</head>
<body>
    <h1>Interactive Food Menu</h1>

    <p>Click on different food items to explore them.</p>

    <img src="A Table Full of Comfort.jpg "
         alt="Food Items Picture"
         usemap="#mapfood">

    <map name="mapfood">

        !-- 1. Circle Area --
        <area shape="circle"
              coords="677,609,200"
              href="https://www.google.com/search?q=pizza"
              alt="Pizza"
              title="Pizza"
              target="_blank">

        !-- 2. Circle Area --
        <area shape="circle"
              coords="300,300,100"
              href="https://www.google.com/search?q=burger"
              alt="Burger"
              title="Burger"
              target="_blank">

        !-- 3. Rectangle Area --
        <area shape="rect"
              coords="87,617,337,501"
              href="https://www.google.com/search?q=pasta"
              alt="Pasta"
              title="Pasta"
              target="_blank">

        !-- 4. Rectangle Area --
        <area shape="rect"
              coords="400,100,650,300"
              href="https://www.google.com/search?q=noodles"
              alt="Noodles"
              title="Noodles"
              target="_blank">

        !-- 5. Polygon Area --
        <area shape="poly"
              coords="983,441,1218,500,967,622,1033,694"
              href="https://www.google.com/search?q=biryani"
              alt="Biryani"
              title="Biryani"
              target="_blank">

        !-- 6. Polygon Area --
        <area shape="poly"
              coords="750,100,900,150,850,300,700,250"
              href="https://www.google.com/search?q=manchurian"
              alt="Manchurian"
              title="Manchurian"
              target="_blank">

        !-- 7. Default Area --
        <area shape="default"
              href="https://www.google.com/search?q=food"
              alt="Food"
              title="Food"
              target="_blank">

    </map>

</body>

</html>
