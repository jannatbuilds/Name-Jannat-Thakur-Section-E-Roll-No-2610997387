<html>
<head>
  <title>Readers' Haven Book Order</title>
</head>
<body style="
      background-image: url('https://i.pinimg.com/1200x/cd/6c/22/cd6c22ee079e083257de11a386302c1e.jpg');
      background-size: cover;
      ">

<h1>Readers' Haven Book Order</h1>

<form action="#" target="_self">

  <label>Customer Name</label>
  <input type="text" placeholder="Enter your name" required>
  <br>
  <br>
  <label>Email Address</label>
  <input type="email" placeholder="Enter your email" required>
  <br>
  <br>
  <label>Mobile Number</label>
  <input type="number" placeholder="Enter your mobile number" required>
  <br>
  <br>
  <label>Age</label>
  <input type="number">
  <br>
  <br>
  <label>Password</label>
  <input type="password" required>
  <br>
  <br>
  <label>Delivery Date</label>
  <input type="date">
  <br>
  <br>
  <label>Preferred Delivery Time</label>
  <input type="time">
  <br>
  <br>

  <label>Favorite Book Category</label>
  <input type="radio" name="category"> Fiction
  <input type="radio" name="category"> Science
  <input type="radio" name="category"> History
  <input type="radio" name="category"> Children's Books
  <br>
  <br>

  <label>Book Title:</label>
  <input type="text">
  <br>
  <br>

  <label>Quantity:</label>
  <input type="number" min="1">
  <br>
  <br>

  <p>Preferred Payment Method</p>
  <input type="radio" name="payment"> Cash on Delivery
  <input type="radio" name="payment"> Online Payment
  <br>
  <br>

  <p>Additional Services:</p>
  <input type="checkbox"> Gift Wrapping
  <input type="checkbox"> Express Delivery
  <input type="checkbox"> Greeting Card
  <br>
  <br>

  <label>Upload a file:</label>
  <input type="file">
  <br>
  <br>

  <label>Delivery Address and Special Instructions:</label><br>
  <textarea rows="4" cols="30"></textarea>
  <br>
  <br>

  <input type="hidden" value="Readers Haven Book Order">

  <button type="submit">Submit</button>
  <button type="reset">Reset</button>

</form>

</body>
</html>
