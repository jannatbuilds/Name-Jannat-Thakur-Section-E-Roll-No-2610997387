<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map Explorer</title>
</head>
<body>

    <h1>World Map Explorer</h1>
    <p>Click on a country to explore!</p>

    <img src="Colorful WorldMap.jpg"
         alt="World map"
         usemap="#worldmap">

    <map name="worldmap">


        <area shape="circle"
              coords="488,279,16"
              href="https://en.wikipedia.org/wiki/India"         
              alt="India"
              target="_blank">

    
       <area shape="circle" 
             coords="142,190,34"
             href="https://en.wikipedia.org/wiki/Canada" 
             alt="Canada"
             target="_blank">


       <area shape="rect"
             coords="494,222,563,268"
             href="https://en.wikipedia.org/wiki/China"
             alt="China"
             target="_blank">


       <area shape="rect" 
             coords="460,137,682,223"
             href="https://en.wikipedia.org/wiki/Russia" 
             alt="Russia"
             target="_blank">


        <area shape="poly"
              coords="569,365,602,350,626,366,624,395,611,408,583,400,568,382"
              href="https://en.wikipedia.org/wiki/Australia"
              alt="Australia"
              target="_blank">

        <area shape="poly"
              coords="231,311,249,309,267,323,273,343,265,366,254,386,239,381,229,363,222,341"
              href="https://en.wikipedia.org/wiki/Brazil" 
              alt="Brazil"
              target="_blank">


        <area shape="default"
              href="https://en.wikipedia.org/wiki/World"
              alt="World information"
              target="_blank">

    </map>

    <p>Explore Australia, India, China, Canada, Brazil, Russia and the world!</p>

</body>
</html>
