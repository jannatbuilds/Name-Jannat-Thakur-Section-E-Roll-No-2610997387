<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Interactive Restaurent Menu </title>
</head>
<body>
    <h1>Interactive Food Menu</h1>

    <p>Click on different food items to explore them.</p>

    <img src="A Table Full of Comfort.jpg "
         alt="Food Items Picture"
         usemap="#mapfood">

    <map name="mapfood">

        <area shape="circle"
              coords="326,335,408"
              href="https://www.bk.com/"
              alt="Pizza"
              title="Pizza"
              target="_blank">

        <area shape="circle"
              coords="212,228,401"
              href="https://www.pizzahut.co.in/"
              alt="Pizza Hut"
              title="Pizza Hut"
              target="_blank">

              <area shape="rect"
              coords="92,76,522,525"
              href="https://baskinrobbinsindia.com/"
              alt="Baskin Robbins"
              title="Baskin Robbins"
              target="_blank">

        <area shape="rect"
              coords="402,437,638,727"
              href="https://mcdindia.com/"
              alt="McD"
              title="McD"
              target="_blank">

        <area shape="poly"
              coords="566,433,540,699,718"
              href="https://www.barista.co.in/"
              alt="Barista"
              title="Barista"
              target="_blank">

        <area shape="poly"
              coords="3,111,149,84,6"
              href="https://www.haldiram.com/"
              alt="Haldiram"
              title="Haldiram"
              target="_blank">

        <area shape="default"  
              coords="671,564,591,670,733" 
              href="https://www.starbucks.com/"
              alt="Starbucks"
              title="Starbucks"
              target="_blank">"

    </map>

</body>

</html>
