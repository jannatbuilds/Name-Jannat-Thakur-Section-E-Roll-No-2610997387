<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Interactive Restaurent Menu </title>
</head>
<body>
    <h1>Interactive Food Menu</h1>

    <p>Click on different food items to explore them.</p>

    <img src="Food items.jpeg"
         alt="Food Items Picture"
         usemap="#mapfood">

    <map name="mapfood">

        <area shape="circle"
              coords="688,177,104"
              href="https://www.bk.com/"
              alt="Burger"
              title="Burger King"
              target="_blank">

        <area shape="circle"
              coords="239,374,267"
              href="https://www.pizzahut.co.in/"
              alt="Pizza"
              title="Pizza Hut"
              target="_blank">

              <area shape="rect"
              coords="832,68,1060,343"
              href="https://www.haldiram.com/"
              alt="French Fries"
              title="Haldiram"
              target="_blank">

        <area shape="rect"
              coords="878,294,1280,840"
              href="https://mcdindia.com/"
              alt="Menu Card"
              title="McD"
              target="_blank">

        <area shape="poly"
              coords="113,1019,83,724,536,570,663,873,324,1020"
              href="https://www.barista.co.in/"
              alt="Sandwhich"
              title="Barista"
              target="_blank">

        <area shape="poly"
              coords="797,549,709,712,916,782,956,719"
              href="https://baskinrobbinsindia.com/"
              alt="Cake"
              title="Baskin Robbins"
              target="_blank">

        <area shape="default"  
              href="https://www.starbucks.com/"
              alt="Starbucks"
              title="Starbucks"
              target="_blank">"

    </map>

</body>

</html>
