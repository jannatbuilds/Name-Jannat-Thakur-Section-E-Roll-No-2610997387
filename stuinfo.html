<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>
</head>
<body style="
      background-image:url('https://i.pinimg.com/736x/0f/58/d6/0f58d6aa180e26ff665837820bd0db2b.jpg');
      background-size: cover;
      ">
<form>
    <label>Name</label>
    <input type="text">
    <br> 
    <br>
    <label>Age</label>
    <input type="number">
    <br>
    <br>
    <label>Gender</label>
    <br>
    <label for="form2"> Male </label>
    <input type="radio" id="Male" name="form2">
    <label for="female">Female</label>
    <input type="radio" id="Female" name="form2">
    <label for="other">Other</label>
    <input type="radio" id="Other" name="form2">
    <br>
    <br>
    <label for="form3">Course</label>
    <br>
    <label for="form3">BCA</label>
    <input type="radio" id="BCA" name="form3">
    <br>
    <label for="form3">B.Sc.</label>
    <input type="radio" id="B.Sc." name="form3">
    <br>
    <label for="form3">B.Tech.</label>
    <input type="radio" id="B.Tech." name="form3">
    <br>
    <br>
    <label for="form4">Skills</label>
    <br>
    <label for="form4">HTML</label>
    <input type="checkbox" id="HTML" name="form4">
    <br>
    <label for="form4">CSS</label>
    <input type="checkbox" id="CSS" name="form4">
    <br>
    <label for="form4">JavaScript</label>
    <input type="checkbox" id="JavaScript" name="form4">
    <br>
    <label for="form4">Python</label>
    <input type="checkbox" id="Python" name="form4">
    <br>

</form>
</body>
</html>
