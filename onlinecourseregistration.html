<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Registration Form</title>
</head>
<body style="
      background-image:url('https://i.pinimg.com/1200x/0e/95/68/0e95686894de0394295d8a22e7660a36.jpg');
      background-color: cover;
      ">
<form>
    <h2><label>Student Name</label></h2>
    <input type="text">
    <br> 
    <br>
    <h2><label>Email Address</label></h2>
    <input type="email">
    <br>
    <br>
    <h2><label>Age</label></h2>
    <input type="number">
    <br>
    <br>
    <h2><label>Mobile Number</label></h2>
    <input type="number">
    <br>
    <br>
    <h2><label>Password</label></h2>
    <input type="password">
    <br>
    <br>
    <h2><label>Gender</label></h2>
    <br>
    <h3><label for="form2"> Male </label>
    <input type="radio" id="Male" name="form2">
    <label for="female">Female</label>
    <input type="radio" id="Female" name="form2">
    <label for="other">Other</label>
    <input type="radio" id="Other" name="form2"></h3>
    <br>
    <br>
    <h2><label for="form4">Skills</label></h2>
    <br>
    <br>
    <h3><label for="form4">HTML</label>
    <input type="checkbox" id="HTML" name="form4">
    <br>
    <br>
    <label for="form4">CSS</label>
    <input type="checkbox" id="CSS" name="form4">
    <br>
    <br>
    <label for="form4">JavaScript</label>
    <input type="checkbox" id="JavaScript" name="form4">
    <br>
    <br>
    <label for="form4">Python</label>
    <input type="checkbox" id="Python" name="form4"></h3>
    <br>
    <br>
    <br>
    <h2><label for="form3">Course</label></h2>
    <br>
    <h3><label for="form3">Web Development</label>
    <input type="radio" id="Web Development" name="form3">
    <br>
    <br>
    <label for="form3">Python Programming</label>
    <input type="radio" id="Python Programming" name="form3">
    <br>
    <br>
    <label for="form3">Data Analytics</label>
    <input type="radio" id="Data Analytics" name="form3">
    <br>
    <br>
    <label for="from3">Digital Marketing</label>
    <input type="radio" id="Digital Maketing" name="form3"></h3>
    <br>
    <br>
    <h2><label for="DateOfBirth">Date of Birth:</label></h2>
    <input type="date" id="DateOfBirth" name="DateOfBirth">
    <br>
    <br>
    <h2><label for="Class Time">Preferred Class Time:</label></h2>
    <input type="time" id="Class Time" name="Class Time">
    <br>
    <p>
    <h3><label for="address">Address / Additional Information:</label></h3>
    <br>
    <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address or any additional information" ></textarea>
    </p>
    <p>
    <h3><label for="document">Upload a Document or Photograph:</label></h3>
    <input type="file" id="document" name="document">
    </p>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</body>
</html>
